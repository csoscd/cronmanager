################################################################################
# GitHub Actions – Build and push :dev Docker images on development branches
#
# Trigger: every push to any branch except main
#          (also available as manual dispatch for testing)
#
# Images produced:
#   cs1711/cronmanager-agent:dev
#   cs1711/cronmanager-web:dev
#
# The :dev tag is always overwritten – it reflects the state of whichever
# development branch was pushed to most recently.  It is intended for testing
# unreleased features and must not be used in production deployments.
#
# Required repository secrets (same as docker-release.yml):
#   DOCKERHUB_USERNAME   – Docker Hub account name (cs1711)
#   DOCKERHUB_TOKEN      – Docker Hub access token (read/write)
#
# @author  Christian Schulz <technik@meinetechnikwelt.rocks>
# @license GNU General Public License version 3 or later
################################################################################

name: Build and push dev Docker images

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual dev build (informational only)"
        required: false
        default: "Manual dev build"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  php-tests:
    name: Unit + integration tests (PHP 8.4)
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:lts
        env:
          MYSQL_ROOT_PASSWORD: root_test
          MYSQL_DATABASE: cronmanager_test
          MYSQL_USER: cronmanager_test
          MYSQL_PASSWORD: cronmanager_test
        ports:
          - 13306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -u root -proot_test --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=20s

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, mbstring, pdo, pdo_mysql
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run unit + integration tests
        run: ./vendor/bin/phpunit --testsuite unit,integration

  build-and-push-dev:
    name: Build ${{ matrix.image }}:dev
    runs-on: ubuntu-latest
    needs: [php-tests]

    strategy:
      fail-fast: false
      matrix:
        include:
          - image:      cronmanager-agent
            dockerfile: docker/agent/Dockerfile
            context:    .
          - image:      cronmanager-web
            dockerfile: docker/web/Dockerfile
            context:    .

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Check out repository
        uses: actions/checkout@v4

      # ── Short SHA ───────────────────────────────────────────────────────────
      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # ── Docker Buildx ───────────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Docker Hub login ────────────────────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Build and push :dev tag ─────────────────────────────────────────────
      - name: Build and push cs1711/${{ matrix.image }}:dev
        uses: docker/build-push-action@v6
        with:
          context:    ${{ matrix.context }}
          file:       ${{ matrix.dockerfile }}
          push:       true
          tags:       cs1711/${{ matrix.image }}:dev
          build-args: APP_VERSION=dev-${{ github.ref_name }}@${{ steps.sha.outputs.short }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=Development build – not for production use
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          platforms:  linux/amd64,linux/arm64

################################################################################
# GitHub Actions – PHP Tests (unit + integration)
#
# Trigger: every push to any branch and every pull request.
#          Provides early feedback before a Docker build is attempted.
#
# This workflow is also referenced by branch protection rules to block merges
# to main when tests are red.
#
# @author  Christian Schulz <technik@meinetechnikwelt.rocks>
# @license GNU General Public License version 3 or later
################################################################################

name: PHP Tests

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  php-tests:
    name: Unit + integration tests (PHP 8.4)
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:lts
        env:
          MYSQL_ROOT_PASSWORD: root_test
          MYSQL_DATABASE: cronmanager_test
          MYSQL_USER: cronmanager_test
          MYSQL_PASSWORD: cronmanager_test
        ports:
          - 13306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -u root -proot_test --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=20s

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Check out repository
        uses: actions/checkout@v4

      # ── PHP 8.4 with required extensions ────────────────────────────────────
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, mbstring, pdo, pdo_mysql
          coverage: none

      # ── Composer cache ───────────────────────────────────────────────────────
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      # ── Install dependencies ─────────────────────────────────────────────────
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # ── Run unit + integration tests ─────────────────────────────────────────
      - name: Run unit + integration tests
        run: ./vendor/bin/phpunit --testsuite unit,integration
